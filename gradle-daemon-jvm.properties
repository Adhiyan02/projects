<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="wrap_content"
    android:orientation="vertical"
    android:padding="20dp">

    <TextView
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="Password Length"
        android:textSize="16sp"
        android:textStyle="bold"
        android:layout_marginBottom="8dp"/>

    <LinearLayout
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:orientation="horizontal"
        android:layout_marginBottom="16dp">

        <SeekBar
            android:id="@+id/lengthSeekBar"
            android:layout_width="0dp"
            android:layout_height="wrap_content"
            android:layout_weight="1"
            android:max="32"
            android:min="6"
            android:progress="12"/>

        <TextView
            android:id="@+id/lengthText"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:text="12"
            android:textSize="18sp"
            android:textStyle="bold"
            android:layout_marginStart="12dp"/>
    </LinearLayout>

    <TextView
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="Include Characters"
        android:textSize="16sp"
        android:textStyle="bold"
        android:layout_marginBottom="12dp"/>

    <CheckBox
        android:id="@+id/uppercaseCheck"
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:text="Uppercase (A-Z)"
        android:checked="true"/>

    <CheckBox
        android:id="@+id/lowercaseCheck"
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:text="Lowercase (a-z)"
        android:checked="true"/>

    <CheckBox
        android:id="@+id/numbersCheck"
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:text="Numbers (0-9)"
        android:checked="true"/>

    <CheckBox
        android:id="@+id/symbolsCheck"
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:text="Symbols (!@#$%^&amp;*)"
        android:checked="true"
        android:layout_marginBottom="16dp"/>

    <TextView
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="Generated Password:"
        android:textSize="14sp"
        android:layout_marginBottom="8dp"/>

    <TextView
        android:id="@+id/generatedPasswordText"
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:text="••••••••••••"
        android:textSize="16sp"
        android:textStyle="bold"
        android:textColor="#6200EE"
        android:background="#F0F0F0"
        android:padding="12dp"
        android:fontFamily="monospace"
        android:layout_marginBottom="12dp"/>

    <Button
        android:id="@+id/generateAgainBtn"
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:text="🔄 Generate Again"
        android:textAllCaps="false"/>

</LinearLayout>
