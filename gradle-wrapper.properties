<?xml version="1.0" encoding="utf-8"?>
<ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="wrap_content">
    <LinearLayout
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:orientation="vertical"
        android:padding="20dp">

        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
            android:text="Title" android:textSize="12sp" android:textColor="#888"/>
        <TextView android:id="@+id/noteDetailTitle"
            android:layout_width="wrap_content" android:layout_height="wrap_content"
            android:textSize="20sp" android:textStyle="bold" android:textColor="#212121"
            android:layout_marginBottom="12dp"/>

        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
            android:text="Category" android:textSize="12sp" android:textColor="#888"/>
        <TextView android:id="@+id/noteDetailCategory"
            android:layout_width="wrap_content" android:layout_height="wrap_content"
            android:textSize="14sp" android:textColor="#6200EE"
            android:layout_marginBottom="16dp"/>

        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
            android:text="Content" android:textSize="12sp" android:textColor="#888"
            android:layout_marginBottom="6dp"/>
        <TextView android:id="@+id/noteDetailContent"
            android:layout_width="match_parent" android:layout_height="wrap_content"
            android:textSize="15sp" android:textColor="#333"
            android:background="#F0F0F0" android:padding="14dp"
            android:minLines="4"/>
    </LinearLayout>
</ScrollView>
